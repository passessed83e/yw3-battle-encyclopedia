<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妖怪ガシャ</title>
<link rel="icon" href="../images/site/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" type="image/png" sizes="32x32" href="../images/site/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="../images/site/apple-touch-icon.png">
<!-- v452: 妖怪ガシャ（全妖怪から、絞り込んだ条件でランダムに指定の数を出す）。大辞典と同じ data/data.js を読む。オフラインでも動く -->
<style>
:root{color-scheme:dark;--bg:#1b1625;--panel:#27213a;--panel2:#332a48;--line:#4c4166;--text:#f7f2fb;--muted:#c2b6d4;--accent:#ffcf5c;--gold:#f5d68f}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1.6px),radial-gradient(rgba(0,0,0,.22) 1px,transparent 1.6px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:linear-gradient(#ffe384,#f3b63c);border:1px solid #fff1bf;color:#3b2507;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,241,191,.55),0 2px 0 #a8701d}
header{background:radial-gradient(ellipse at 25% -20%,rgba(255,235,200,.12),transparent 55%),linear-gradient(160deg,#913b33,#732c27 55%,#5d2320);border-bottom:1px solid #c9a15d;box-shadow:inset 0 0 0 7px #732c27,inset 0 0 0 9px #d8b36e,inset 0 0 0 12px #732c27,inset 0 0 0 13px #b48b4b;padding:22px 26px}
header .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:24px;color:#f5d68f;text-shadow:0 2px 0 #451714}
header a{color:#f1dcc7;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.num{display:flex;align-items:center;gap:6px;font-weight:700}
.num input{width:5.5em;background:#1d1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.check{display:flex;align-items:center;gap:6px;white-space:nowrap}
.check input{margin:0;width:auto}
.roll{font-size:18px;padding:10px 26px}
.pool{margin-left:auto;font-size:13px;color:var(--gold);border:1px solid #7d6438;background:#4a3a1c;border-radius:99px;padding:4px 12px;white-space:nowrap}
details.filters{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.filters summary{cursor:pointer;font-weight:700;color:var(--gold)}
.fgroup{margin-top:10px}
.fgroup h2{font-size:13px;margin:0 0 6px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#1d1729;border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none}
.chip input{margin:0}
.chip:has(input:checked){border-color:var(--accent);background:#4a3a1c}
.chip img{width:18px;height:18px}
.search{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);max-width:360px}
.search input{background:#1d1729;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text)}
.factions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msg{min-height:1.5em;color:var(--gold);margin:4px 2px 10px;font-size:14px}
.result{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ball{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:#1d1729;border:1px solid var(--line);border-radius:14px;min-width:0;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.medal-wrap{position:relative}
.medal{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a3150,#1a1524 70%);border:4px solid var(--gr,#9aa3b5);box-shadow:0 0 0 2px #15111d,0 0 12px var(--gr,#9aa3b5);display:grid;place-items:center;overflow:hidden}
.medal img{width:84%;height:84%;object-fit:contain}
.rank{position:absolute;left:-6px;bottom:-4px;width:28px;height:28px;filter:drop-shadow(0 1px 1px #000)}
.nm{font-size:13px;font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.ball[data-r="E"]{--gr:#9aa3b5}.ball[data-r="D"]{--gr:#6cc070}.ball[data-r="C"]{--gr:#4fa3e0}.ball[data-r="B"]{--gr:#b07ad9}.ball[data-r="A"]{--gr:#e0604f}.ball[data-r="S"]{--gr:#f5c542}
@keyframes pop{0%{opacity:0;transform:scale(.4) translateY(10px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
.history{font-size:13px;color:var(--muted)}
.history ol{margin:6px 0 0;padding-left:1.4em}
.history li{margin:2px 0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
@media (max-width:560px){header{padding:18px 20px}header h1{font-size:20px}.wrap{padding:12px}.pool{margin-left:0}.result{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.medal{width:68px;height:68px}.rank{width:24px;height:24px}}
</style>
</head>
<body>
<header><div class="in"><h1>妖怪ガシャ</h1><a href="../index.html">← 妖怪ウォッチ3 対戦大辞典にもどる</a></div></header>
<main class="wrap">
<section class="panel" aria-label="ガシャの設定">
 <div class="controls">
  <label class="num">出す数<input type="number" id="count" min="1" max="100" value="6" inputmode="numeric"></label>
  <label class="check"><input type="checkbox" id="dup"> 同じ妖怪も出る</label>
  <button type="button" class="primary roll" id="roll">ガシャを回す</button>
  <span class="pool" id="pool">対象 698体</span>
 </div>
 <details class="filters" id="filters" open>
  <summary>絞り込み</summary>
  <div class="fgroup"><label class="search">名前で検索（ひらがな・カタカナどちらでも）<input type="search" id="q" placeholder="例：ニャン"></label></div>
  <div class="fgroup"><h2>ランク</h2><div class="chips" id="fRank"></div></div>
  <div class="fgroup"><h2>種族</h2><div class="chips" id="fTribe"></div></div>
  <div class="fgroup"><h2>登場作品</h2><div class="chips" id="fGame"></div></div>
  <div class="fgroup"><h2>得意属性</h2><div class="chips" id="fStrong"></div></div>
  <div class="fgroup"><h2>苦手属性</h2><div class="chips" id="fWeak"></div></div>
  <div class="factions"><button type="button" id="resetFilters">絞り込みを全て解除</button></div>
  <p class="note">同じ項目の中で複数選ぶと「どれか」、別の項目どうしは「全部」を満たす妖怪が対象です。何も選ばない項目は全て対象です。</p>
 </details>
</section>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<section class="panel" aria-label="ガシャの結果">
 <div class="controls" style="margin-bottom:10px"><button type="button" id="copy" disabled>名前をコピー</button><button type="button" id="clear" disabled>結果を消す</button></div>
 <div class="result" id="result"></div>
 <p class="note">どの妖怪も同じ確率で出ます（ゲームの妖怪ガシャの確率とは違います）。ランクは元のランクです。</p>
</section>
<section class="panel history" aria-label="これまでの結果"><b>これまでの結果（新しい順・最大10回）</b><ol id="history"></ol></section>
</main>
<!-- v458: 最小限の権利表記 -->
<footer style="max-width:1100px;margin:0 auto;padding:8px 16px 24px;font-size:11px;color:var(--muted);line-height:1.6">当サイトは非公式のファンサイトで、株式会社レベルファイブ・関係各社とは関係ありません。「妖怪ウォッチ」の名称・画像などの権利は各権利者に帰属します。© LEVEL-5 Inc.</footer>
<script src="../data/data.js"></script>
<script>
(()=>{
 const data=(window.YOKAI_DATA||[]).filter(x=>x&&x.id&&x.name);
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const thumb=p=>{const m=/^images\/yokai\/(\d{3})\.png$/.exec(p||'');return m?`../images/thumb/${m[1]}.webp`:'../'+(p||'');};
 const RANKS=['E','D','C','B','A','S'];
 const rankOf=x=>{const m=/^([SABCDE])ランク/.exec(x.rank||'');return m?m[1]:'';};
 const toKata=s=>String(s||'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).toLocaleLowerCase('ja');
 const ATTR=['火','水','雷','土','風','氷','なし'];
 const strongOf=x=>x.attributeAffinity?.strong||'',weakOf=x=>x.attributeAffinity?.weak||'';
 const count=(arr,f)=>{const o=new Map();arr.forEach(x=>{const v=f(x);if(v)o.set(v,(o.get(v)||0)+1);});return o;};
 const chips=(id,values,counts,icon)=>{$(id).innerHTML=values.filter(v=>counts.get(v)).map(v=>`<label class="chip"><input type="checkbox" value="${esc(v)}">${icon?icon(v):''}<span>${esc(v)}</span></label>`).join('');};
 chips('fRank',RANKS,count(data,rankOf),v=>`<img src="../images/rank/rank_${v}.png" alt="">`);
 const tribes=[...count(data,x=>x.tribe).entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);chips('fTribe',tribes,count(data,x=>x.tribe));
 const games=['妖怪ウォッチ','妖怪ウォッチ2','妖怪ウォッチ3','妖怪ウォッチバスターズ','妖怪三国志'];const gc=count(data,x=>x.game);chips('fGame',[...games,...[...gc.keys()].filter(g=>!games.includes(g))],gc);
 const sc=count(data,strongOf),wc=count(data,weakOf);chips('fStrong',[...ATTR,...[...sc.keys()].filter(a=>!ATTR.includes(a))],sc);chips('fWeak',[...ATTR,...[...wc.keys()].filter(a=>!ATTR.includes(a))],wc);
 const sel=id=>new Set([...document.querySelectorAll(`#${id} input:checked`)].map(i=>i.value));
 const pool=()=>{const q=toKata($('q').value.trim()),r=sel('fRank'),t=sel('fTribe'),g=sel('fGame'),s=sel('fStrong'),w=sel('fWeak');
  return data.filter(x=>(!q||toKata(x.name).includes(q))&&(!r.size||r.has(rankOf(x)))&&(!t.size||t.has(x.tribe))&&(!g.size||g.has(x.game))&&(!s.size||s.has(strongOf(x)))&&(!w.size||w.has(weakOf(x))));};
 const updPool=()=>{const n=pool().length;$('pool').textContent=n===data.length?`対象 全${n}体`:`対象 ${n}体（絞り込み中）`;$('roll').disabled=!n;};
 const rnd=n=>{if(window.crypto&&crypto.getRandomValues){const lim=Math.floor(0x100000000/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a);}while(a[0]>=lim);return a[0]%n;}return Math.floor(Math.random()*n);};
 const num=()=>{const v=Math.floor(Number($('count').value));return Math.max(1,Math.min(100,Number.isFinite(v)?v:1));};
 let last=[],hist=[];const PREF='yw3-gacha-tool-v1';
 const save=()=>{try{localStorage.setItem(PREF,JSON.stringify({n:num(),dup:$('dup').checked,hist:hist.map(h=>({t:h.t,ids:h.ids}))}));}catch(e){}};
 const show=()=>{$('result').innerHTML=last.map((x,i)=>{const r=rankOf(x);return `<div class="ball" data-r="${r}" style="animation-delay:${Math.min(i,30)*60}ms"><div class="medal-wrap"><div class="medal"><img src="${esc(thumb(x.image))}" data-orig="../${esc(x.image)}" alt="" loading="lazy" decoding="async" onerror="if(this.dataset.orig&&this.src.indexOf(this.dataset.orig.slice(3))<0){this.src=this.dataset.orig}else{this.style.opacity=.15}"></div>${r?`<img class="rank" src="../images/rank/rank_${r}.png" alt="${r}ランク">`:''}</div><div class="nm" title="${esc(x.name)}">${esc(x.name)}</div><div class="sub">${esc((x.tribe||'').replace(/族$/,''))}${x.officialNo?` ・No.${String(x.officialNo).padStart(3,'0')}`:''}</div></div>`;}).join('');$('copy').disabled=$('clear').disabled=!last.length;};
 const showHist=()=>{$('history').innerHTML=hist.map(h=>{const d=new Date(h.t),z=n=>String(n).padStart(2,'0');const names=h.ids.map(id=>byId.get(id)?.name).filter(Boolean);return `<li>${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}　${esc(names.join('、'))}</li>`;}).join('')||'<li>まだありません</li>';};
 const byId=new Map(data.map(x=>[x.id,x]));
 $('roll').addEventListener('click',()=>{const p=pool();if(!p.length){$('msg').textContent='条件に合う妖怪がいません。絞り込みを変えてください。';return;}
  const n=num(),dup=$('dup').checked;let out=[];
  if(dup){for(let i=0;i<n;i++)out.push(p[rnd(p.length)]);}else{const a=p.slice(),k=Math.min(n,a.length);for(let i=0;i<k;i++){const j=i+rnd(a.length-i);[a[i],a[j]]=[a[j],a[i]];}out=a.slice(0,k);}
  last=out;$('msg').textContent=(!dup&&n>p.length)?`対象が${p.length}体なので、${p.length}体すべてを出しました。`:`${p.length}体の中から${out.length}体出しました。`;show();
  hist.unshift({t:Date.now(),ids:out.map(x=>x.id)});hist=hist.slice(0,10);showHist();save();
  if(matchMedia('(max-width:560px)').matches)$('msg').scrollIntoView({block:'start'});});
 $('clear').addEventListener('click',()=>{last=[];show();$('msg').textContent='';});
 $('copy').addEventListener('click',async()=>{const t=last.map(x=>x.name).join('\n');let ok=false;try{await navigator.clipboard.writeText(t);ok=true;}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy');}catch(e2){}ta.remove();}$('msg').textContent=ok?`${last.length}体の名前をコピーしました。`:'コピーできませんでした。';});
 $('count').addEventListener('change',()=>{$('count').value=num();save();});$('dup').addEventListener('change',save);
 document.querySelector('.filters').addEventListener('change',updPool);$('q').addEventListener('input',updPool);
 $('resetFilters').addEventListener('click',()=>{document.querySelectorAll('.filters input[type=checkbox]').forEach(i=>i.checked=false);$('q').value='';updPool();});
 try{const s=JSON.parse(localStorage.getItem(PREF)||'null');if(s){if(s.n)$('count').value=Math.max(1,Math.min(100,Math.floor(s.n)||6));$('dup').checked=!!s.dup;if(Array.isArray(s.hist))hist=s.hist.filter(h=>h&&Array.isArray(h.ids)).slice(0,10);}}catch(e){}
 if(!data.length){$('msg').textContent='妖怪データ（data/data.js）を読み込めませんでした。';$('roll').disabled=true;}
 if(matchMedia('(max-width:560px)').matches)$('filters').open=false;/* スマホでは絞り込みを閉じておく */
 updPool();showHist();
})();
</script>
</body>
</html>
